<text x="281" y="350" text-anchor="middle" fill="#111827" font-size="14" font-weight="600">Local state</text>
<text x="281" y="370" text-anchor="middle" fill="#6b7280" font-size="12" font-weight="400">Same data kept a second time</text>
<line x1="281" y1="382" x2="281" y2="410" stroke="#dc2626" stroke-width="1.5" marker-end="url(#arrow-red)"/>
