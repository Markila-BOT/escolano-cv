  <rect width="1088" height="720" fill="#ffffff"/>
<text x="40" y="36" text-anchor="start" fill="#111827" font-size="20" font-weight="600">Owner Web App store, October 2023</text>
<text x="40" y="60" text-anchor="start" fill="#6b7280" font-size="13" font-weight="400">OWA-590. unistore removed. Staging stress test, one demo owner, one navigation sequence.</text>
