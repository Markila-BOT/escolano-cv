<text x="807" y="258" text-anchor="middle" fill="#111827" font-size="14" font-weight="600">Jotai atoms</text>
<text x="807" y="278" text-anchor="middle" fill="#6b7280" font-size="12" font-weight="400">One owner for each piece of data</text>
<line x1="807" y1="290" x2="807" y2="318" stroke="#16a34a" stroke-width="1.5" marker-end="url(#arrow-green)"/>
<rect x="657" y="324" width="300" height="58" rx="8" ry="8" fill="#ffffff" stroke="#d1d5db" stroke-width="1.5"/>
<text x="807" y="350" text-anchor="middle" fill="#111827" font-size="14" font-weight="600">React Query</text>
<text x="807" y="370" text-anchor="middle" fill="#6b7280" font-size="12" font-weight="400">Cache on the request</text>
<line x1="807" y1="382" x2="807" y2="410" stroke="#16a34a" stroke-width="1.5" marker-end="url(#arrow-green)"/>
<rect x="657" y="416" width="300" height="58" rx="8" ry="8" fill="#ffffff" stroke="#d1d5db" stroke-width="1.5"/>
<text x="807" y="442" text-anchor="middle" fill="#111827" font-size="14" font-weight="600">API</text>
<text x="807" y="462" text-anchor="middle" fill="#6b7280" font-size="12" font-weight="400">Types sit with the response</text>
<rect x="586" y="548" width="442" height="76" rx="8" ry="8" fill="#ffffff" stroke="#86efac" stroke-width="1.5"/>
<text x="807" y="578" text-anchor="middle" fill="#111827" font-size="16" font-weight="600">MyCashFlow average  0.0116s</text>
<text x="807" y="602" text-anchor="middle" fill="#6b7280" font-size="13" font-weight="400">Full sequence  00:34</text>
<text x="40" y="678" text-anchor="start" fill="#111827" font-size="14" font-weight="600">The page states 2698% faster for that MyCashFlow stress test.</text>
<text x="40" y="700" text-anchor="start" fill="#6b7280" font-size="13" font-weight="400">Also written: tokens left the store, chat records were de-duplicated, unused actions were removed.</text>
