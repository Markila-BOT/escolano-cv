<text x="281" y="258" text-anchor="middle" fill="#111827" font-size="14" font-weight="600">unistore</text>
<text x="281" y="278" text-anchor="middle" fill="#6b7280" font-size="12" font-weight="400">Global store, tokens inside it</text>
<line x1="281" y1="290" x2="281" y2="318" stroke="#dc2626" stroke-width="1.5" marker-end="url(#arrow-red)"/>
