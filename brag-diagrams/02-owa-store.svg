<text x="281" y="578" text-anchor="middle" fill="#111827" font-size="16" font-weight="600">MyCashFlow average  0.3443s</text>
<text x="281" y="602" text-anchor="middle" fill="#6b7280" font-size="13" font-weight="400">Full sequence  01:36</text>
