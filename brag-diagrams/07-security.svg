<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1088 640" width="1088" height="640">
  <style>
    text { font-family: 'Helvetica Neue', Helvetica, Arial, 'PingFang SC', 'Microsoft YaHei', 'Microsoft JhengHei', 'SimHei', sans-serif; }
  </style>
  <defs>
    <marker id="arrow-blue" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#2563eb"/>
    </marker>
    <marker id="arrow-red" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#dc2626"/>
    </marker>
    <marker id="arrow-green" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#16a34a"/>
    </marker>
    <marker id="arrow-orange" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#ea580c"/>
    </marker>
  </defs>
  <rect width="1088" height="640" fill="#ffffff"/>
<text x="40" y="36" text-anchor="start" fill="#111827" font-size="20" font-weight="600">Frontend security standards, 1 February 2022</text>
<text x="40" y="60" text-anchor="start" fill="#6b7280" font-size="13" font-weight="400">Three pages, each version 1. Policy he wrote. Not an audit of running clusters.</text>
<rect x="36" y="88" width="332" height="520" rx="8" ry="8" fill="#fff7ed" stroke="#fdba74" stroke-width="1.5"/>
<text x="202" y="122" text-anchor="middle" fill="#111827" font-size="16" font-weight="600">Containers</text>
<rect x="52" y="150" width="300" height="42" rx="8" ry="8" fill="#ffffff" stroke="#fdba74" stroke-width="1.5"/>
<text x="202" y="176" text-anchor="middle" fill="#111827" font-size="13" font-weight="500">One app per image</text>
<rect x="52" y="202" width="300" height="42" rx="8" ry="8" fill="#ffffff" stroke="#fdba74" stroke-width="1.5"/>
<text x="202" y="228" text-anchor="middle" fill="#111827" font-size="13" font-weight="500">Alpine, scratch, or distroless</text>
<rect x="52" y="254" width="300" height="42" rx="8" ry="8" fill="#ffffff" stroke="#fdba74" stroke-width="1.5"/>
<text x="202" y="280" text-anchor="middle" fill="#111827" font-size="13" font-weight="500">Pin the base tag</text>
<rect x="52" y="306" width="300" height="42" rx="8" ry="8" fill="#ffffff" stroke="#fdba74" stroke-width="1.5"/>
<text x="202" y="332" text-anchor="middle" fill="#111827" font-size="13" font-weight="500">Do not run as root</text>
<rect x="52" y="358" width="300" height="42" rx="8" ry="8" fill="#ffffff" stroke="#fdba74" stroke-width="1.5"/>
<text x="202" y="384" text-anchor="middle" fill="#111827" font-size="13" font-weight="500">No secrets in the image</text>
<rect x="52" y="410" width="300" height="42" rx="8" ry="8" fill="#ffffff" stroke="#fdba74" stroke-width="1.5"/>
<text x="202" y="436" text-anchor="middle" fill="#111827" font-size="13" font-weight="500">No SSH in the container</text>
<rect x="52" y="462" width="300" height="42" rx="8" ry="8" fill="#ffffff" stroke="#fdba74" stroke-width="1.5"/>
<text x="202" y="488" text-anchor="middle" fill="#111827" font-size="13" font-weight="500">Multi-stage build</text>
<rect x="52" y="514" width="300" height="42" rx="8" ry="8" fill="#ffffff" stroke="#fdba74" stroke-width="1.5"/>
<text x="202" y="540" text-anchor="middle" fill="#111827" font-size="13" font-weight="500">Copy only what runs</text>
<rect x="384" y="88" width="332" height="520" rx="8" ry="8" fill="#eff6ff" stroke="#93c5fd" stroke-width="1.5"/>
<text x="550" y="122" text-anchor="middle" fill="#111827" font-size="16" font-weight="600">Response headers</text>
<rect x="400" y="150" width="300" height="42" rx="8" ry="8" fill="#ffffff" stroke="#93c5fd" stroke-width="1.5"/>
<text x="550" y="176" text-anchor="middle" fill="#111827" font-size="13" font-weight="500">Content-Security-Policy</text>
<rect x="400" y="202" width="300" height="42" rx="8" ry="8" fill="#ffffff" stroke="#93c5fd" stroke-width="1.5"/>
<text x="550" y="228" text-anchor="middle" fill="#111827" font-size="13" font-weight="500">Strict-Transport-Security</text>
<rect x="400" y="254" width="300" height="42" rx="8" ry="8" fill="#ffffff" stroke="#93c5fd" stroke-width="1.5"/>
<text x="550" y="280" text-anchor="middle" fill="#111827" font-size="13" font-weight="500">X-Frame-Options</text>
<rect x="400" y="306" width="300" height="42" rx="8" ry="8" fill="#ffffff" stroke="#93c5fd" stroke-width="1.5"/>
<text x="550" y="332" text-anchor="middle" fill="#111827" font-size="13" font-weight="500">X-Content-Type-Options</text>
<rect x="400" y="358" width="300" height="42" rx="8" ry="8" fill="#ffffff" stroke="#93c5fd" stroke-width="1.5"/>
<text x="550" y="384" text-anchor="middle" fill="#111827" font-size="13" font-weight="500">Referrer-Policy</text>
<rect x="400" y="410" width="300" height="42" rx="8" ry="8" fill="#ffffff" stroke="#93c5fd" stroke-width="1.5"/>
<text x="550" y="436" text-anchor="middle" fill="#111827" font-size="13" font-weight="500">Feature-Policy</text>
<rect x="400" y="462" width="300" height="42" rx="8" ry="8" fill="#ffffff" stroke="#93c5fd" stroke-width="1.5"/>
<text x="550" y="488" text-anchor="middle" fill="#111827" font-size="13" font-weight="500">Check securityheaders.com</text>
<rect x="400" y="514" width="300" height="42" rx="8" ry="8" fill="#ffffff" stroke="#93c5fd" stroke-width="1.5"/>
<text x="550" y="540" text-anchor="middle" fill="#111827" font-size="13" font-weight="500">QA before it goes live</text>
<rect x="732" y="88" width="332" height="520" rx="8" ry="8" fill="#f0fdf4" stroke="#86efac" stroke-width="1.5"/>
<text x="898" y="122" text-anchor="middle" fill="#111827" font-size="16" font-weight="600">Logs</text>
<rect x="748" y="150" width="300" height="42" rx="8" ry="8" fill="#ffffff" stroke="#86efac" stroke-width="1.5"/>
<text x="898" y="176" text-anchor="middle" fill="#111827" font-size="13" font-weight="500">DEBUG only in development</text>
<rect x="748" y="202" width="300" height="42" rx="8" ry="8" fill="#ffffff" stroke="#86efac" stroke-width="1.5"/>
<text x="898" y="228" text-anchor="middle" fill="#111827" font-size="13" font-weight="500">INFO from staging upward</text>
<rect x="748" y="254" width="300" height="42" rx="8" ry="8" fill="#ffffff" stroke="#86efac" stroke-width="1.5"/>
<text x="898" y="280" text-anchor="middle" fill="#111827" font-size="13" font-weight="500">ISO-8601 timestamps</text>
<rect x="748" y="306" width="300" height="42" rx="8" ry="8" fill="#ffffff" stroke="#86efac" stroke-width="1.5"/>
<text x="898" y="332" text-anchor="middle" fill="#111827" font-size="13" font-weight="500">dd.trace_id and dd.span_id</text>
<rect x="748" y="358" width="300" height="42" rx="8" ry="8" fill="#ffffff" stroke="#86efac" stroke-width="1.5"/>
<text x="898" y="384" text-anchor="middle" fill="#111827" font-size="13" font-weight="500">Write stdout or stderr</text>
<rect x="748" y="410" width="300" height="42" rx="8" ry="8" fill="#ffffff" stroke="#86efac" stroke-width="1.5"/>
<text x="898" y="436" text-anchor="middle" fill="#111827" font-size="13" font-weight="500">No passwords or tokens</text>
<rect x="748" y="462" width="300" height="42" rx="8" ry="8" fill="#ffffff" stroke="#86efac" stroke-width="1.5"/>
<text x="898" y="488" text-anchor="middle" fill="#111827" font-size="13" font-weight="500">No card numbers or PII</text>
<rect x="748" y="514" width="300" height="42" rx="8" ry="8" fill="#ffffff" stroke="#86efac" stroke-width="1.5"/>
<text x="898" y="540" text-anchor="middle" fill="#111827" font-size="13" font-weight="500">ISO 27001 A.12.4</text>
</svg>
