<text x="972" y="589" text-anchor="middle" fill="#111827" font-size="14" font-weight="600">Google Maps</text>
<rect x="36" y="680" width="1048" height="56" rx="8" ry="8" fill="#f9fafb" stroke="#e5e7eb" stroke-width="1.5"/>
<text x="56" y="704" text-anchor="start" fill="#111827" font-size="13" font-weight="400">About 119 unique endpoints across the four repositories.</text>
<text x="56" y="722" text-anchor="start" fill="#6b7280" font-size="13" font-weight="400">Schedule written on the plan: 5 phases, 12 weeks, with AI assistance. That is a plan, not a finished duration.</text>
