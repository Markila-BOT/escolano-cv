<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" width="960" height="520">
  <style>
    text { font-family: 'Helvetica Neue', Helvetica, Arial, 'PingFang SC', 'Microsoft YaHei', 'Microsoft JhengHei', 'SimHei', sans-serif; }
  </style>
  <defs>
    <marker id="arrow-blue" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#2563eb"/>
    </marker>
    <marker id="arrow-red" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#dc2626"/>
    </marker>
    <marker id="arrow-green" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#16a34a"/>
    </marker>
    <marker id="arrow-orange" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#ea580c"/>
    </marker>
  </defs>
  <rect width="960" height="520" fill="#ffffff"/>
<text x="40" y="36" text-anchor="start" fill="#111827" font-size="20" font-weight="600">Release commits he did not want dropped</text>
<text x="40" y="60" text-anchor="start" fill="#6b7280" font-size="13" font-weight="400">SPD-1157. Owner Web App merge request 2168. Several teams, one repository.</text>
<rect x="36" y="96" width="888" height="80" rx="8" ry="8" fill="#ffffff" stroke="#d1d5db" stroke-width="1.5"/>
<rect x="36" y="96" width="72" height="80" rx="8" ry="8" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1.5"/>
<text x="72" y="142" text-anchor="middle" fill="#2563eb" font-size="16" font-weight="600">01</text>
<text x="128" y="130" text-anchor="start" fill="#111827" font-size="16" font-weight="600">Currency symbol</text>
<text x="128" y="154" text-anchor="start" fill="#6b7280" font-size="14" font-weight="400">Fallback when the currency has no symbol.</text>
<rect x="36" y="192" width="888" height="80" rx="8" ry="8" fill="#ffffff" stroke="#d1d5db" stroke-width="1.5"/>
<rect x="36" y="192" width="72" height="80" rx="8" ry="8" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1.5"/>
<text x="72" y="238" text-anchor="middle" fill="#2563eb" font-size="16" font-weight="600">02</text>
<text x="128" y="226" text-anchor="start" fill="#111827" font-size="16" font-weight="600">Room sorting</text>
<text x="128" y="250" text-anchor="start" fill="#6b7280" font-size="14" font-weight="400">Order taken from the Potato API, then applied.</text>
<rect x="36" y="288" width="888" height="80" rx="8" ry="8" fill="#ffffff" stroke="#d1d5db" stroke-width="1.5"/>
<rect x="36" y="288" width="72" height="80" rx="8" ry="8" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1.5"/>
<text x="72" y="334" text-anchor="middle" fill="#2563eb" font-size="16" font-weight="600">03</text>
<text x="128" y="322" text-anchor="start" fill="#111827" font-size="16" font-weight="600">Types</text>
<text x="128" y="346" text-anchor="start" fill="#6b7280" font-size="14" font-weight="400">Remove any, and remove the mutations.</text>
<rect x="36" y="384" width="888" height="80" rx="8" ry="8" fill="#ffffff" stroke="#d1d5db" stroke-width="1.5"/>
<rect x="36" y="384" width="72" height="80" rx="8" ry="8" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1.5"/>
<text x="72" y="430" text-anchor="middle" fill="#2563eb" font-size="16" font-weight="600">04</text>
<text x="128" y="418" text-anchor="start" fill="#111827" font-size="16" font-weight="600">Expense sorting</text>
<text x="128" y="442" text-anchor="start" fill="#6b7280" font-size="14" font-weight="400">The same room order applied to expense.</text>
</svg>
