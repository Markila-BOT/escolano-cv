<text x="56" y="582" text-anchor="start" fill="#111827" font-size="14" font-weight="400">4  Immer is a skill worth having once it is learned.</text>
<text x="56" y="612" text-anchor="start" fill="#111827" font-size="14" font-weight="400">5  A selector hook keeps a later move small,</text>
